<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <title>Listado de Usuarios</title>
    <style>
        .no-pagado { color: red; font-weight: bold; }
        .pagado { color: green; font-weight: bold; }
        /* Estilos generales para tablas y bordes */
        .tabla-usuario, .tabla-pagos { border-collapse: collapse; margin-bottom: 5px; width: 50%; }
        .tabla-usuario, .tabla-pagos th, .tabla-pagos td { border: 1px solid black; padding: 5px; text-align: left; }
    </style>
</h:head>

<h:body>
    <h1>Usuarios y Pagos</h1>

    <ui:repeat var="u" value="#{helloBean.usuarios}">
        <h2>Usuario: #{u.nombre} #{u.apellidos}</h2>

        <table class="tabla-usuario">
            <tr>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>NIF</th> <th>Email</th>
                <th>Edad</th>
            </tr>
            <tr>
                <td>#{u.nombre}</td>
                <td>#{u.apellidos}</td>
                <td>#{u.dni}</td> <td>#{u.email}</td>
                <td>#{u.edad}</td>
            </tr>
        </table>

        <h3>Pagos del año</h3>

        <h:dataTable value="#{u.pagos.entrySet().toArray()}" var="pago" styleClass="tabla-pagos">

            <h:column>
                <f:facet name="header">Mes</f:facet>
                #{pago.key}
            </h:column>

            <h:column>
                <f:facet name="header">Importe</f:facet>
                <h:outputText value="#{pago.value} €"
                              rendered="#{not empty pago.value}" />
                <h:outputText value="NO PAGADO" styleClass="no-pagado"
                              rendered="#{empty pago.value}" />
            </h:column>

        </h:dataTable>

        <table class="tabla-usuario" style="width: 50%; margin-top: 0;">
            <tr>
                <th style="width: 50%;">Total anual</th>
                <th style="width: 50%;">#{u.totalPagos()} €</th>
            </tr>
        </table>

        <h4>
            <h:outputText value="El usuario no está al día con la cuota" styleClass="no-pagado"
                          rendered="#{u.totalPagos() lt 100}" />
            <h:outputText value="El usuario está al corriente de pagos" styleClass="pagado"
                          rendered="#{u.totalPagos() >= 100}" />
        </h4>

        <hr />
    </ui:repeat>
</h:body>
</html>
